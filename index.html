<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>حاسبة تحمّل الكرتون</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Readex+Pro:wght@500;600;700&display=swap">
<style>

/* Layout: two columns — inputs grouped by topic (right, RTL) and a sticky results panel (left); one column on phones */
:root{
  --bg:#F1EFEA; --surface:#FFFFFF; --line:#DED8CD; --fg:#23211D; --muted:#6E685E;
  --kraft:#A06A35; --kraft-soft:#F3E6D6; --green:#2F5D46; --green-soft:#E3EEE7;
  --ok:#2E7D4F; --ok-bg:#E2F2E8; --warn:#A86A06; --warn-bg:#FBEFD9; --bad:#B23A2E; --bad-bg:#F8E1DE;
  --font-body:"IBM Plex Sans Arabic", "Segoe UI", Tahoma, sans-serif;
  --font-display:"Readex Pro", "IBM Plex Sans Arabic", "Segoe UI", Tahoma, sans-serif;
  --radius:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#161816; --surface:#202321; --line:#343833; --fg:#ECE8E0; --muted:#A39D92;
  --kraft:#D39B60; --kraft-soft:#3A2E22; --green:#7DBA97; --green-soft:#1F3229;
  --ok:#6CC891; --ok-bg:#1D3326; --warn:#E5B04F; --warn-bg:#3A2E15; --bad:#EE8579; --bad-bg:#3D211E; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#161816; --surface:#202321; --line:#343833; --fg:#ECE8E0; --muted:#A39D92;
  --kraft:#D39B60; --kraft-soft:#3A2E22; --green:#7DBA97; --green-soft:#1F3229;
  --ok:#6CC891; --ok-bg:#1D3326; --warn:#E5B04F; --warn-bg:#3A2E15; --bad:#EE8579; --bad-bg:#3D211E; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.6;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:24px 48px}
.wrap{max-width:1080px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
header{display:flex;flex-direction:column;gap:4px}
h1{font-family:var(--font-display);font-weight:700;font-size:clamp(24px,4vw,32px);margin:0;text-wrap:balance;letter-spacing:-.2px}
h1 span{color:var(--kraft)}
.sub{color:var(--muted);margin:0;max-width:62ch}
.grid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:820px){.grid{grid-template-columns:minmax(0,1fr)}}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px;display:flex;flex-direction:column;gap:16px;min-width:0}
fieldset{border:0;margin:0;padding:0;display:flex;flex-direction:column;gap:12px;min-width:0}
fieldset + fieldset{border-top:1px solid var(--line);padding-top:16px}
legend{font-family:var(--font-display);font-weight:600;font-size:15px;padding:0;margin-bottom:10px;display:flex;align-items:center;gap:8px}
legend i{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:6px;background:var(--kraft-soft);color:var(--kraft);font-style:normal;font-size:12px;font-family:var(--font-display)}
.row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.row.two{grid-template-columns:repeat(2,minmax(0,1fr))}
@media (max-width:420px){.row{grid-template-columns:repeat(2,minmax(0,1fr))}}
.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.f label,.lbl{font-size:13px;color:var(--muted)}
.inp{position:relative}
.inp input,.inp select{width:100%;font:inherit;font-variant-numeric:tabular-nums;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:9px 10px;padding-inline-end:44px;min-height:42px;appearance:none;-webkit-appearance:none}
.inp select{padding-inline-end:30px;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:left 14px center,left 9px center;background-size:5px 5px;background-repeat:no-repeat}
.inp .u{position:absolute;inset-inline-end:10px;top:50%;transform:translateY(-50%);font-size:12px;color:var(--muted);pointer-events:none}
.inp input:focus-visible,.inp select:focus-visible,.seg input:focus-visible+span,.btn:focus-visible,summary:focus-visible{outline:2px solid var(--kraft);outline-offset:2px}
input[type=number]::-webkit-inner-spin-button{opacity:.4}
.hint{font-size:12px;color:var(--muted)}

.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg label{position:relative;cursor:pointer}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg span{display:flex;flex-direction:column;align-items:center;min-width:64px;padding:7px 12px;border:1px solid var(--line);border-radius:9px;background:var(--bg);font-size:14px;line-height:1.3;transition:background .15s,border-color .15s}
.seg span small{font-size:11px;color:var(--muted)}
.seg input:checked+span{background:var(--green-soft);border-color:var(--green);color:var(--green);font-weight:600}
.seg input:checked+span small{color:var(--green)}
.check{display:flex;align-items:center;gap:8px;font-size:14px;cursor:pointer}
.check input{width:18px;height:18px;accent-color:var(--green)}

/* results */
.results{position:sticky;top:max(12px, env(safe-area-inset-top, 0px))}
@media (max-width:820px){.results{position:static}}
.card{display:flex;flex-direction:column;gap:12px}
.card + .card{border-top:1px solid var(--line);padding-top:16px}
.card h2{font-family:var(--font-display);font-size:16px;font-weight:600;margin:0;display:flex;align-items:center;justify-content:space-between;gap:8px}
.big{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.big b{font-family:var(--font-display);font-weight:700;font-size:clamp(34px,6vw,44px);line-height:1;font-variant-numeric:tabular-nums;color:var(--fg)}
.big em{font-style:normal;color:var(--muted);font-size:14px}
.kv{display:grid;grid-template-columns:1fr auto;gap:6px 12px;margin:0;font-size:14px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-variant-numeric:tabular-nums;font-weight:600;text-align:left;direction:ltr}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;padding:3px 10px;border-radius:999px;white-space:nowrap}
.chip::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.chip.ok{color:var(--ok);background:var(--ok-bg)} .chip.warn{color:var(--warn);background:var(--warn-bg)} .chip.bad{color:var(--bad);background:var(--bad-bg)}
.note{font-size:13px;color:var(--muted);margin:0}

.meter{display:flex;flex-direction:column;gap:6px}
.bar{position:relative;height:12px;border-radius:999px;background:var(--bg);border:1px solid var(--line);overflow:hidden}
.bar .fill{position:absolute;inset-block:0;inset-inline-start:0;border-radius:999px;transition:width .25s}
.bar .mark{position:absolute;inset-block:-2px;width:2px;background:var(--fg);opacity:.55}
.scale{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}

.stack{display:flex;align-items:flex-end;gap:14px}
.tower{display:flex;flex-direction:column-reverse;gap:2px;width:64px;flex:none}
.tower div{height:9px;border-radius:2px;background:var(--kraft-soft);border:1px solid var(--kraft)}
.tower div.base{background:var(--kraft);}
.tower .more{border:0;background:none;height:auto;text-align:center;font-size:11px;color:var(--muted)}

.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{font:inherit;font-size:14px;font-weight:600;cursor:pointer;border-radius:9px;padding:9px 14px;border:1px solid var(--green);background:var(--green);color:var(--surface)}
.btn.ghost{background:transparent;color:var(--green)}
.toast{font-size:13px;color:var(--ok);align-self:center}
textarea.msg{width:100%;min-height:150px;font:inherit;font-size:13.5px;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:10px;resize:vertical}

details{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 18px}
summary{cursor:pointer;font-family:var(--font-display);font-weight:600}
details p,details li{color:var(--muted);font-size:14px;max-width:72ch}
details code{font-family:ui-monospace,Consolas,monospace;font-size:13px;direction:ltr;unicode-bidi:embed;background:var(--bg);padding:1px 5px;border-radius:5px;color:var(--fg)}
.disclaimer{font-size:13px;color:var(--muted);border-inline-start:3px solid var(--kraft);padding-inline-start:10px;margin:0}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ---- activation ---- */
[hidden]{display:none!important}
html,body{margin:0}
.gcard textarea::placeholder{font-family:var(--font-body);font-size:14px;letter-spacing:0}
.results{top:calc(var(--bar-h,0px) + 12px)}
body.has-bar{padding-top:calc(var(--bar-h,0px) + 18px)}
.tbar{position:fixed;inset:0 0 auto;z-index:20;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 14px;
  padding-top:calc(10px + env(safe-area-inset-top,0px));padding-bottom:10px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background:var(--green-soft);border-bottom:1px solid var(--line);color:var(--fg);font-size:14px}
.tbar.low{background:var(--warn-bg)}
.tbar .cd{font-family:var(--font-display);font-weight:600;font-variant-numeric:tabular-nums;color:var(--green)}
.tbar.low .cd{color:var(--warn)}
.tb-a{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tb-btn{font:inherit;font-weight:600;font-size:13.5px;text-decoration:none;padding:7px 14px;border-radius:9px;background:var(--green);color:var(--surface);border:0;cursor:pointer}
.tb-link{font:inherit;font-size:13px;background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;padding:4px}
.gate{min-height:calc(100vh - 80px);display:grid;place-items:center}
.gcard{width:100%;max-width:440px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:28px 22px;display:flex;flex-direction:column;gap:14px;text-align:center}
.gicon{width:56px;height:56px;margin:0 auto;border-radius:14px;background:var(--kraft-soft);display:grid;place-items:center;color:var(--kraft)}
.gcard h1{font-size:24px}
.gcard p{margin:0;color:var(--muted)}
.gcard form{display:flex;flex-direction:column;gap:10px}
.gcard textarea{width:100%;font-family:ui-monospace,Consolas,monospace;font-size:12.5px;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;resize:vertical;word-break:break-all}
.gcard textarea:focus-visible{outline:2px solid var(--kraft);outline-offset:2px}
.gcard .btn{display:block;text-align:center;text-decoration:none;padding:11px 14px}
.gerr{color:var(--bad)!important;font-size:13.5px}
.gsmall{font-size:12.5px}
.gstate{font-family:var(--font-display);font-weight:600;color:var(--warn)!important}
</style>
</head>
<body>
<div id="bar" class="tbar" hidden>
  <span><b>نسخة تجريبية</b> · باقي <span id="cd" class="cd">…</span></span>
  <span class="tb-a"><a id="reqBtn" class="tb-btn" target="_blank" rel="noopener">طلب تفعيل دائم</a><button type="button" id="chg" class="tb-link">إدخال كود</button></span>
</div>
<div id="gate" class="gate" hidden>
  <div class="gcard">
    <div class="gicon"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="M3 7.5 12 3l9 4.5v9L12 21l-9-4.5z"/><path d="M3 7.5 12 12l9-4.5M12 12v9"/></svg></div>
    <h1>حاسبة تحمّل الكرتون</h1>
    <p id="gState" class="gstate" hidden></p>
    <p id="gMsg">دخّل كود التفعيل يلي وصلك لتفتح الحاسبة.</p>
    <form id="gForm">
      <textarea id="code" rows="4" dir="ltr" spellcheck="false" placeholder="الصق كود التفعيل أو رابط التفعيل هون"></textarea>
      <p id="gErr" class="gerr" hidden></p>
      <button class="btn" type="submit" id="gGo">تفعيل</button>
    </form>
    <a id="gReq" class="btn ghost" target="_blank" rel="noopener">اطلب كود عالواتساب</a>
    <p id="gNote" class="gsmall" hidden></p>
  </div>
</div>
<div id="app"></div>

  var LS = 'bsc-license', LSEEN = 'bsc-seen';
  var $ = function(id){ return document.getElementById(id); };
  var store = {
    get: function(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } },
    set: function(k,v){ try{ localStorage.setItem(k,v); }catch(e){} },
    del: function(k){ try{ localStorage.removeItem(k); }catch(e){} }
  };
  function b64u(s){
    s = String(s).replace(/\s+/g,'').replace(/-/g,'+').replace(/_/g,'/');
    while(s.length % 4) s += '=';
    var b = atob(s), u = new Uint8Array(b.length);
    for(var i=0;i<b.length;i++) u[i] = b.charCodeAt(i);
    return u;
  }
  function extract(txt){
    txt = String(txt || '').trim();
    var m = txt.match(/k=([A-Za-z0-9_\-]+)/);
    return m ? m[1] : txt.replace(/\s+/g,'');
  }
  var BAD = 'الكود ناقص أو مكتوب غلط. انسخه كامل متل ما وصلك، أو افتح رابط التفعيل مباشرة.';
  async function parse(code){
    var raw;
    try{ raw = b64u(code); }catch(e){ return {err: BAD}; }
    if(raw.length !== 93 || raw[0] !== 1) return {err: BAD};
    var p = raw.slice(0,29), sig = raw.slice(29);
    try{
      var key = await crypto.subtle.importKey('jwk', CFG.pub, {name:'ECDSA', namedCurve:'P-256'}, false, ['verify']);
      var ok = await crypto.subtle.verify({name:'ECDSA', hash:'SHA-256'}, key, sig, p);
      if(!ok) return {err:'هالكود مش صالح لهالحاسبة. تأكد إنك نسخته كامل، أو اطلب كود جديد.'};
    }catch(e){ return {err:'المتصفح ما قدر يتحقق من الكود. افتح الرابط بكروم أو سفاري محدّث.'}; }
    var dv = new DataView(p.buffer), ex = dv.getUint32(6);
    return {code: code, type: p[1], issued: dv.getUint32(2)*60000, exp: ex === 0xFFFFFFFF ? Infinity : ex*60000,
            client: (p[10]<<16)|(p[11]<<8)|p[12], k: p.slice(13,29)};
  }
  async function trustedNow(){
    var t = Date.now();
    if(location.protocol.indexOf('http') === 0){
      try{
        var ctl = new AbortController(); var tm = setTimeout(function(){ ctl.abort(); }, 3500);
        var r = await fetch(location.pathname + '?t=' + Date.now(), {method:'HEAD', cache:'no-store', signal: ctl.signal});
        clearTimeout(tm);
        var d = Date.parse(r.headers.get('date') || '');
        if(isFinite(d)) t = d;
      }catch(e){}
    }
    var seen = +store.get(LSEEN) || 0;
    t = Math.max(t, seen);
    store.set(LSEEN, String(t));
    return t;
  }
  function idText(n){ return String(n).padStart(4,'0'); }
  function waLink(text){
    var num = String(CFG.wa || '').replace(/\D/g,'');
    return num ? 'https://wa.me/' + num + '?text=' + encodeURIComponent(text) : null;
  }
  function wire(a, text){
    var href = waLink(text);
    if(href){ a.href = href; return; }
    a.href = '#';
    a.addEventListener('click', function(e){
      e.preventDefault();
      var done = function(){ a.textContent = 'انسخت الرسالة، ابعتها لمزوّد الحاسبة'; };
      try{ navigator.clipboard.writeText(text).then(done, done); }catch(err){ done(); }
    });
  }
  function showGate(opts){
    opts = opts || {};
    $('gate').hidden = false;
    if(opts.state){ $('gState').hidden = false; $('gState').textContent = opts.state; }
    if(opts.msg) $('gMsg').textContent = opts.msg;
    if(opts.err){ $('gErr').hidden = false; $('gErr').textContent = opts.err; }
    if(opts.client != null){ $('gNote').hidden = false; $('gNote').textContent = 'رقم الترخيص: ' + idText(opts.client); }
    var t = opts.client != null
      ? 'مرحبا، بدي تفعيل دائم لـ «' + CFG.app + '». رقم الترخيص: ' + idText(opts.client)
      : 'مرحبا، بدي كود تفعيل لـ «' + CFG.app + '».';
    if(opts.client != null) $('gReq').textContent = 'طلب تفعيل دائم';
    wire($('gReq'), t);
  }
  async function openApp(k){
    var blob = b64u(CFG.blob);
    var key = await crypto.subtle.importKey('raw', k, 'AES-GCM', false, ['decrypt']);
    var html = new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM', iv: blob.slice(0,12)}, key, blob.slice(12)));
    var app = $('app');
    app.innerHTML = html;
    app.querySelectorAll('script').forEach(function(s){ var n = document.createElement('script'); n.textContent = s.textContent; s.replaceWith(n); });
  }
  function dayWord(d){ return d === 1 ? 'يوم' : d === 2 ? 'يومين' : d <= 10 ? d + ' أيام' : d + ' يوم'; }
  function two(n){ return (n < 10 ? '0' : '') + n; }
  function startBar(lic, skew){
    var bar = $('bar');
    bar.hidden = false;
    document.body.classList.add('has-bar');
    var fit = function(){ document.documentElement.style.setProperty('--bar-h', bar.offsetHeight + 'px'); };
    fit(); window.addEventListener('resize', fit);
    wire($('reqBtn'), 'مرحبا، بدي تفعيل دائم لـ «' + CFG.app + '». رقم الترخيص: ' + idText(lic.client));
    $('chg').addEventListener('click', function(){ bar.hidden = true; document.body.classList.remove('has-bar'); $('app').hidden = true; showGate({msg:'دخّل كود التفعيل الدائم يلي وصلك.', client: lic.client}); $('code').focus(); });
    var tick = function(){
      var left = lic.exp - (Date.now() + skew);
      if(left <= 0){ location.reload(); return; }
      var s = Math.floor(left/1000), d = Math.floor(s/86400), h = Math.floor(s%86400/3600), m = Math.floor(s%3600/60), sec = s%60;
      $('cd').textContent = (d > 0 ? dayWord(d) + ' و ' : '') + two(h) + ':' + two(m) + ':' + two(sec);
      bar.classList.toggle('low', left < 2*86400000);
      fit();
    };
    tick(); setInterval(tick, 1000);
  }

  $('gForm').addEventListener('submit', async function(e){
    e.preventDefault();
    $('gErr').hidden = true;
    var lic = await parse(extract($('code').value));
    if(lic.err){ $('gErr').hidden = false; $('gErr').textContent = lic.err; return; }
    var now = await trustedNow();
    if(now >= lic.exp){ $('gErr').hidden = false; $('gErr').textContent = 'هالكود خلصت مدته. اطلب كود جديد.'; return; }
    store.set(LS, lic.code);
    location.reload();
  });

  async function boot(){
    if(!window.crypto || !crypto.subtle){ showGate({err:'افتح الحاسبة من الرابط مباشرة (https) بمتصفح محدّث.'}); return; }
    var fromHash = null;
    var m = location.hash.match(/k=([A-Za-z0-9_\-]+)/);
    if(m){ fromHash = m[1]; try{ history.replaceState(null, '', location.pathname + location.search); }catch(e){} }
    var cands = [];
    if(fromHash){ var a = await parse(fromHash); cands.push(a); }
    var saved = store.get(LS);
    if(saved && saved !== fromHash){ var b = await parse(saved); if(b.err) store.del(LS); else cands.push(b); }
    var good = cands.filter(function(c){ return !c.err; });
    if(!good.length){ showGate(fromHash ? {err: cands[0].err} : {}); return; }
    var now = await trustedNow(), skew = now - Date.now();
    var live = good.filter(function(c){ return now < c.exp; }).sort(function(x,y){ return y.exp - x.exp; });
    if(!live.length){
      var last = good.sort(function(x,y){ return y.exp - x.exp; })[0];
      store.set(LS, last.code);
      showGate({state:'انتهت الفترة التجريبية', msg:'لتكمل استعمال الحاسبة اطلب التفعيل الدائم، أو دخّل كود جديد.', client: last.client});
      return;
    }
    var lic = live[0];
    store.set(LS, lic.code);
    try{ await openApp(lic.k); }
    catch(e){ store.del(LS); showGate({err:'هالكود صادر لنسخة قديمة من الحاسبة. اطلب كود جديد.', client: lic.client}); return; }
    if(lic.exp !== Infinity) startBar(lic, skew);
  }
  boot();
})();
